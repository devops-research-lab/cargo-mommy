name: Rust
on:
  push: null
env:
  RUSTFLAGS: -Dwarnings
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Run cargo fmt
      run: 'cargo fmt --all -- --check

        '
  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Run cargo clippy
      run: 'cargo clippy --tests --examples

        '
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@stable
    - name: Run rustdoc
      run: 'cargo doc --no-deps

        '
  os-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macOS-latest
        feature-flags:
        - --no-default-features
        - ''
        - --all-features
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@stable
    - name: Run cargo test
      run: cargo test ${{ matrix.feature-flags }}
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@stable
    - name: Run cargo check
      run: 'cargo check --all --tests

        '
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@stable
    - uses: taiki-e/install-action@cargo-hack
    - name: Run cargo hack powerset
      run: 'cargo hack check --feature-powerset --no-dev-deps

        '
